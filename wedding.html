<!DOCTYPE html>
<html>
<head>
    <title>Wedding Photography | Lens House Photography</title>
    <meta name="viewport" content="width=device-width,
        initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="logo">
        <h1>Lens House<br>Photography</h1>
    </div>
<button class="menu-toggle" onclick="toggleMenu()">☰</button>
    <nav>
        <a href="index.html#home">Home</a>
        <a href="index.html#about">About</a>
        <a href="index.html#services">Services</a>
        <a href="index.html#packages">Packages</a>
        <a href="gallery.html">Gallery</a>
        <a href="index.html#contact">Contact</a>
    </nav>
</header>


<section class="gallery-hero">
    <div>
        <p class="small-title">WEDDING PHOTOGRAPHY</p>
        <h2>Wedding Stories</h2>
        <p>Beautiful moments captured through our lens.</p>
    </div>
</section>


<section class="photo-gallery">

    <img src="Images/Wedding Photography/wedding1.jpg" alt="Wedding Photography">
    <img src="Images/Wedding Photography/wedding2.jpg" alt="Wedding Photography">
    <img src="Images/Wedding Photography/wedding3.jpg" alt="Wedding Photography">
    <img src="Images/Wedding Photography/wedding4.jpg" alt="Wedding Photography">
    <img src="Images/Wedding Photography/wedding5.jpg" alt="Wedding Photography">
    <img src="Images/Wedding Photography/wedding6.jpg" alt="Wedding Photography">
</section>

<footer>

    <h3>Lens House Photography</h3>

    <p>Capturing moments. Creating memories.</p>

    <p class="copyright">
        © 2026 Lens House Photography. All Rights Reserved.
    </p>

</footer>

<div id="photoModal" class="photo-modal">
    <span class="close-photo">&times;</span>
    <img id="modalImage" src="" alt="Wedding Photography">
</div>

<script>
    const photos = document.querySelectorAll(".photo-gallery img");
    const modal = document.getElementById("photoModal");
    const modalImage = document.getElementById("modalImage");
    const closePhoto = document.querySelector(".close-photo");

    photos.forEach(photo => {
        photo.addEventListener("click", () => {
            modal.style.display = "flex";
            modalImage.src = photo.src;
        });
    });

    closePhoto.addEventListener("click", () => {
        modal.style.display = "none";
    });

    modal.addEventListener("click", (event) => {
        if (event.target === modal) {
            modal.style.display = "none";
        }
    });
</script>
<script>
function toggleMenu() {
    document.querySelector("nav").classList.toggle("active");
}
</script>
</body>
</html>
